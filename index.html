  <!-- Firebase SDK (Auth y Firestore gratuitos) -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, increment, serverTimestamp } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyAmOYaCC8du903_Et_SfITxLxvrnAEROKU",
      authDomain: "://firebaseapp.com",
      projectId: "goldstar-9e03b",
      storageBucket: "goldstar-9e03b.firebasestorage.app",
      messagingSenderId: "786421674823",
      appId: "1:786421674823:web:4a65b3fa0550c180bcd262"
    };

    const app = initializeApp(firebaseConfig);
    window.fbAuth = getAuth(app);
    window.fbDb = getFirestore(app);
    window.fbFuncs = {
      signInAnonymously, onAuthStateChanged,
      collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, increment, serverTimestamp
    };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <!-- Lógica de la Aplicación -->
  <script type="text/babel">
    const CLOUDINARY_CLOUD_NAME = "wtua9l4u";
    const CLOUDINARY_UPLOAD_PRESET = "Videofast";

    const { useState, useEffect, useRef } = React;

    function App() {
      const [ready, setReady] = useState(!!window.fbFuncs);
      const [videos, setVideos] = useState([]);
      const [user, setUser] = useState(null);
      const [showUpload, setShowUpload] = useState(false);
      const [file, setFile] = useState(null);
      const [caption, setCaption] = useState('');
      const [uploading, setUploading] = useState(false);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        if (!ready) {
          const handler = () => setReady(true);
          window.addEventListener('firebase-ready', handler);
          return () => window.removeEventListener('firebase-ready', handler);
        }
      }, [ready]);

      useEffect(() => {
        if (!ready) return;
        const { signInAnonymously, onAuthStateChanged, collection, onSnapshot, query, orderBy } = window.fbFuncs;

        signInAnonymously(window.fbAuth).catch(err => console.error("Auth error:", err));
        const unsubAuth = onAuthStateChanged(window.fbAuth, (u) => setUser(u));

        const q = query(collection(window.fbDb, 'videos'), orderBy('createdAt', 'desc'));
        const unsubDocs = onSnapshot(q, (snapshot) => {
          setVideos(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => { unsubAuth(); unsubDocs(); };
      }, [ready]);

      const handleUpload = async (e) => {
        e.preventDefault();
        if (!file || !ready) return;
        setUploading(true);
        setProgress(5);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://cloudinary.com{CLOUDINARY_CLOUD_NAME}/video/upload`, true);

        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            const pct = Math.round((event.loaded / event.total) * 100);
            setProgress(pct);
          }
        };

        xhr.onload = async () => {
          if (xhr.status === 200) {
            const response = JSON.parse(xhr.responseText);
            const { addDoc, collection, serverTimestamp } = window.fbFuncs;
            await addDoc(collection(window.fbDb, 'videos'), {
              videoUrl: response.secure_url,
              caption: caption || 'Video en Goldstar',
              user: user ? `User_${user.uid.slice(0, 5)}` : 'Invitado',
              likes: 0,
              createdAt: serverTimestamp()
            });
            setUploading(false);
            setShowUpload(false);
            setFile(null);
            setCaption('');
            setProgress(0);
          } else {
            alert("Error al subir a Cloudinary. Verifica que el preset 'Videofast' esté en modo 'Sin firmar'.");
            setUploading(false);
          }
        };

        xhr.onerror = () => {
          alert("Error de red al intentar subir el video.");
          setUploading(false);
        };

        xhr.send(formData);
      };

      const handleLike = async (videoId) => {
        const { doc, updateDoc, increment } = window.fbFuncs;
        await updateDoc(doc(window.fbDb, 'videos', videoId), { likes: increment(1) });
      };

      return (
        <div className="relative h-screen w-screen bg-black text-white overflow-hidden">
          <div className="absolute top-0 left-0 right-0 z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
            <h1 className="text-xl font-extrabold tracking-wider text-yellow-400">GOLDSTAR</h1>
            <span className="text-xs bg-white/15 px-3 py-1 rounded-full backdrop-blur-sm">Para ti</span>
          </div>

          <div className="h-full w-full overflow-y-scroll snap-y snap-mandatory no-scrollbar">
            {videos.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                <p className="mb-4 text-lg">Aún no hay videos publicados.</p>
                <button
                  onClick={() => setShowUpload(true)}
                  className="bg-yellow-500 text-black font-bold px-6 py-3 rounded-full shadow-lg active:scale-95 transition"
                >
                  + Subir primer video
                </button>
              </div>
            ) : (
              videos.map((v) => (
                <VideoItem key={v.id} video={v} onLike={() => handleLike(v.id)} />
              ))
            )}
          </div>

          <div className="absolute bottom-0 left-0 right-0 z-20 h-16 bg-black/90 border-t border-white/10 flex justify-around items-center">
            <button className="text-sm font-bold text-white">Inicio</button>
            <button
              onClick={() => setShowUpload(true)}
              className="bg-gradient-to-r from-yellow-400 to-amber-600 text-black px-4 py-2 rounded-xl font-black text-xl shadow-lg active:scale-95 transition"
            >
              +
            </button>
            <button className="text-sm text-gray-400">Perfil</button>
          </div>

          {showUpload && (
            <div className="absolute inset-0 z-30 bg-black/95 flex flex-col justify-center p-6">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-xl font-bold text-yellow-400">Nuevo Video</h2>
                <button onClick={() => setShowUpload(false)} className="text-2xl font-bold px-2">✕</button>
              </div>

              <form onSubmit={handleUpload} className="space-y-4">
                <label className="border-2 border-dashed border-gray-600 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer hover:border-yellow-400">
                  <span className="text-3xl mb-2">🎬</span>
                  <span className="text-sm text-gray-300 text-center">
                    {file ? file.name : "Toca aquí para elegir un video (.mp4)"}
                  </span>
                  <input
                    type="file"
                    accept="video/mp4,video/webm,video/*"
                    className="hidden"
                    onChange={(e) => setFile(e.target.files[0])}
                    required
                  />
                </label>

                <input
                  type="text"
                  placeholder="Escribe una descripción..."
                  value={caption}
                  onChange={(e) => setCaption(e.target.value)}
                  className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-yellow-400"
                />

                {uploading && (
                  <div className="w-full bg-gray-800 rounded-full h-3 overflow-hidden">
                    <div className="bg-yellow-400 h-3 transition-all" style={{ width: `${progress}%` }}></div>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={uploading || !file}
                  className="w-full bg-yellow-500 disabled:bg-gray-700 text-black font-bold py-3.5 rounded-xl transition"
                >
                  {uploading ? `Subiendo... ${progress}%` : 'Publicar Ahora'}
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

      const videoRef = useRef(null);
      const [playing, setPlaying] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {

              videoRef.current?.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
